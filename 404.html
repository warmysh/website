<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to /website/</title>
  <script>
    (function () {
      var p = window.location.pathname || "/";
      var q = window.location.search || "";
      var h = window.location.hash || "";
      var knownRoots = ["/docs", "/oem", "/safety", "/platform", "/configurations", "/roadmap"];

      if (p === "/" || p === "/website") {
        window.location.replace("/website/" + q + h);
        return;
      }

      if (!p.startsWith("/website/")) {
        var isKnownRootPath = knownRoots.some(function (root) {
          return p === root || p.startsWith(root + "/");
        });

        if (isKnownRootPath) {
          window.location.replace("/website" + p + q + h);
          return;
        }

        window.location.replace("/website/" + q + h);
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.45;
      color: #1f2937;
      background: #f8fafc;
    }
    main {
      max-width: 640px;
      margin: 12vh auto 0;
      padding: 0 20px;
    }
    a {
      color: #0b63ce;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting...</h1>
    <p>This project is temporarily published under <code>/website/</code>.</p>
    <p>If redirect does not start automatically, open <a href="/website/">/website/</a>.</p>
    <noscript>
      <p>JavaScript is disabled. Please use the link above.</p>
    </noscript>
  </main>
</body>
</html>
